# Page: device
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: device
label: Device
icon: device
order: 6
remote_configurable: true
description: Device behavior, units, and recording settings
sections:
- id: general
  title: General
  description: Power, boot, and unit preferences
  items:
  - key: OffroadMode
    widget: toggle
    title: Force Offroad Mode
  - key: DeviceBootMode
    widget: option
    title: Wake Up Behavior
    description: 'Controls state of the device after boot/sleep. Default: Device will boot/wake-up normally and will be ready
      to engage. Offroad: Device will be in Always Offroad mode after boot/wake-up.'
    options:
    - value: 0
      label: Standard
    - value: 1
      label: Always Offroad
  - key: QuietMode
    widget: toggle
    title: Quiet Mode
  - key: OnroadUploads
    widget: toggle
    title: Onroad Uploads
  - key: MaxTimeOffroad
    widget: option
    title: Max Time Offroad
    description: Device will automatically shutdown after set time once the engine is turned off. 30h is the default.
    options:
    - value: 0
      label: Always On
    - value: 5
      label: 5m
    - value: 10
      label: 10m
    - value: 15
      label: 15m
    - value: 30
      label: 30m
    - value: 60
      label: 1h
    - value: 120
      label: 2h
    - value: 180
      label: 3h
    - value: 300
      label: 5h
    - value: 600
      label: 10h
    - value: 1440
      label: 24h
    - value: 1800
      label: 30h (Default)
- id: private_dashcam
  title: Private Dashcam
  description: Self-hosted route media backup
  items:
  - key: PrivateDashcamEnabled
    widget: toggle
    title: Private Dashcam Uploads
    description: Uploads completed route media to your self-hosted dashcam ingest API. Configure endpoint and token over SSH before enabling this.
    enablement:
    - $ref: '#/macros/offroad'
  - key: PrivateDashcamBlockCommaUploads
    widget: toggle
    title: Block comma Uploads
    description: Stops the stock comma uploader from sending route files to comma servers. Enable only after private uploads are configured and working.
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: PrivateDashcamEnabled
      equals: true
  - key: PrivateDashcamUploadOnroad
    widget: toggle
    title: Upload While Driving
    description: Allows private dashcam uploads while onroad. Leave off to upload only after the drive ends.
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: PrivateDashcamEnabled
      equals: true
  - key: PrivateDashcamUploadMetered
    widget: toggle
    title: Upload on Metered Networks
    description: Allows private dashcam uploads on metered networks.
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: PrivateDashcamEnabled
      equals: true
- id: language
  title: Language
  items:
  - key: LanguageSetting
    widget: info
    title: Language
